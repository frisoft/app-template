[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/application",
    "crates/infrastructure",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
authors = ["Your Name <you@example.com>"]
repository = "https://example.com/your-repo"

[workspace.dependencies]
# Internal crates.
#   - `package` renames the published name so imports read as `domain`, etc.
#   - Dependencies between them encode the dependency rule (point inward only).
domain = { path = "crates/domain", package = "app-domain" }
application = { path = "crates/application", package = "app-application" }
infrastructure = { path = "crates/infrastructure", package = "app-infrastructure" }

# External crates.
async-trait = "0.1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

# Lint policy. Crates opt in with `[lints] workspace = true`. `warn` here plus
# `clippy -- -D warnings` in the Makefile makes every one of these an error in
# `make check`, while a plain `cargo clippy` (IDE) still reports them.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Start from the default set, then add the stricter tiers on top.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight this codebase's explicit, documented style.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# The composition root standardises on `fn main() -> anyhow::Result<()>` so the
# shape is right before the first arm can actually fail (see AGENTS.md §5).
unnecessary_wraps = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[profile.dev]
# No debug info: smaller `target/` and faster linking, at the cost of backtraces
# without file:line detail. Use `debug = "line-tables-only"` if you want those
# back without the bulk of full debug info.
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
